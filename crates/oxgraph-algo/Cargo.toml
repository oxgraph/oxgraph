[package]
name = "oxgraph-algo"
version = "0.0.0"
description = "Substrate-agnostic graph algorithms over oxgraph-topology traits."
publish = false

authors.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
oxgraph-graph = { version = "0.0.0", path = "../oxgraph-graph" }
oxgraph-hyper = { version = "0.0.0", path = "../oxgraph-hyper" }
oxgraph-topology = { version = "0.0.0", path = "../oxgraph-topology" }

[features]
default = []
alloc = []
std = ["alloc"]

[dev-dependencies]
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
criterion = { workspace = true }
oxgraph-csr = { version = "0.0.0", path = "../oxgraph-csr" }
oxgraph-graph-build = { version = "0.0.0", path = "../oxgraph-graph-build" }
oxgraph-hyper = { version = "0.0.0", path = "../oxgraph-hyper" }
oxgraph-hyper-bcsr = { version = "0.0.0", path = "../oxgraph-hyper-bcsr" }
oxgraph-hyper-build = { version = "0.0.0", path = "../oxgraph-hyper-build" }
oxgraph-property = { version = "0.0.0", path = "../oxgraph-property" }
oxgraph-snapshot = { version = "0.0.0", path = "../oxgraph-snapshot", features = ["alloc"] }
proptest = { workspace = true }
zerocopy = { workspace = true }

[[bench]]
name = "bfs"
harness = false
required-features = ["std"]

[[bench]]
name = "pagerank"
harness = false
required-features = ["std"]

[lints]
workspace = true
