[package]
name = "oxgraph-hyper-bcsr"
version = "0.0.0"
description = "Borrowed bipartite CSR hypergraph views implementing oxgraph-hyper traits."
publish = false

authors.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
oxgraph-hyper = { version = "0.0.0", path = "../oxgraph-hyper" }
oxgraph-snapshot = { version = "0.0.0", path = "../oxgraph-snapshot" }
zerocopy = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
oxgraph-snapshot = { version = "0.0.0", path = "../oxgraph-snapshot", features = ["alloc"] }
proptest = { workspace = true }

[[bench]]
name = "bcsr"
harness = false

[[bench]]
name = "snapshot"
harness = false

[lints]
workspace = true
