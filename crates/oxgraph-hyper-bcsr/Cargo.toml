[package]
name = "oxgraph-hyper-bcsr"
version = "0.0.0"
description = "Borrowed bipartite CSR hypergraph views implementing oxgraph-hyper traits."
publish = false

authors.workspace = true
edition.workspace = true
repository.workspace = true

[features]
default = []
build = ["oxgraph-snapshot/alloc"]
build-property-arrow = ["build", "dep:oxgraph-property"]

[dependencies]
oxgraph-hyper = { version = "0.0.0", path = "../oxgraph-hyper" }
oxgraph-layout-util = { version = "0.0.0", path = "../oxgraph-layout-util" }
oxgraph-property = { version = "0.0.0", path = "../oxgraph-property", optional = true }
oxgraph-snapshot = { version = "0.0.0", path = "../oxgraph-snapshot" }
zerocopy = { workspace = true }

[dev-dependencies]
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
criterion = { workspace = true }
oxgraph-property = { version = "0.0.0", path = "../oxgraph-property" }
oxgraph-snapshot = { version = "0.0.0", path = "../oxgraph-snapshot", features = ["alloc"] }
proptest = { workspace = true }
saphyr-parser = { workspace = true }

[[bench]]
name = "bcsr"
harness = false

[[bench]]
name = "snapshot"
harness = false

[[bench]]
name = "builder"
harness = false
required-features = ["build"]

[[example]]
name = "yaml_to_hypergraph"
required-features = ["build", "build-property-arrow"]

[[test]]
name = "build_proptest"
required-features = ["build-property-arrow"]

[lints]
workspace = true
