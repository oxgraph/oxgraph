[package]
name = "oxgraph-db"
version.workspace = true
license.workspace = true
description = "Standalone OxGraph-native database engine above the topology substrate."
categories.workspace = true
keywords.workspace = true
readme.workspace = true

authors.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
oxgraph-algo = { version = "0.1.0", path = "../oxgraph-algo", default-features = false, features = [
  "alloc",
] }
oxgraph-csc = { version = "0.1.0", path = "../oxgraph-csc" }
oxgraph-csr = { version = "0.1.0", path = "../oxgraph-csr", features = ["build"] }
oxgraph-graph = { version = "0.1.0", path = "../oxgraph-graph" }
oxgraph-hyper = { version = "0.1.0", path = "../oxgraph-hyper" }
oxgraph-hyper-bcsr = { version = "0.1.0", path = "../oxgraph-hyper-bcsr", features = ["build"] }
oxgraph-property = { version = "0.1.0", path = "../oxgraph-property" }
oxgraph-snapshot = { version = "0.1.0", path = "../oxgraph-snapshot", features = ["alloc"] }
oxgraph-topology = { version = "0.1.0", path = "../oxgraph-topology" }
serde = { workspace = true }
serde_json = { workspace = true }
zerocopy = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "open_recovery"
harness = false

[lints]
workspace = true
