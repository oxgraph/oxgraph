[package]
name = "oxgraph-csr"
version = "0.0.0"
description = "Borrowed CSR graph views implementing oxgraph-graph traits."
publish = false

authors.workspace = true
edition.workspace = true
repository.workspace = true

[features]
default = []
build = ["oxgraph-snapshot/alloc"]
build-property-arrow = ["build", "dep:oxgraph-property"]

[dependencies]
oxgraph-graph = { version = "0.0.0", path = "../oxgraph-graph" }
oxgraph-layout-util = { version = "0.0.0", path = "../oxgraph-layout-util" }
oxgraph-property = { version = "0.0.0", path = "../oxgraph-property", optional = true }
oxgraph-snapshot = { version = "0.0.0", path = "../oxgraph-snapshot" }
zerocopy = { workspace = true }

[dev-dependencies]
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
criterion = { workspace = true }
oxgraph-algo = { version = "0.0.0", path = "../oxgraph-algo", features = ["alloc"] }
oxgraph-property = { version = "0.0.0", path = "../oxgraph-property" }
oxgraph-snapshot = { version = "0.0.0", path = "../oxgraph-snapshot", features = ["alloc"] }
proptest = { workspace = true }

[[bench]]
name = "csr"
harness = false

[[bench]]
name = "snapshot"
harness = false

[[bench]]
name = "builder"
harness = false
required-features = ["build"]

[[test]]
name = "build_proptest"
required-features = ["build-property-arrow"]

[lints]
workspace = true
