[package]
name = "oxgraph-csr"
version = "0.0.0"
description = "Borrowed CSR graph views implementing oxgraph-graph traits."
publish = false

authors.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
oxgraph-graph = { version = "0.0.0", path = "../oxgraph-graph" }
oxgraph-snapshot = { version = "0.0.0", path = "../oxgraph-snapshot" }
oxgraph-topology = { version = "0.0.0", path = "../oxgraph-topology" }
zerocopy = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
oxgraph-algo = { version = "0.0.0", path = "../oxgraph-algo", features = ["alloc"] }
oxgraph-snapshot = { version = "0.0.0", path = "../oxgraph-snapshot", features = ["alloc"] }
proptest = { workspace = true }

[[bench]]
name = "csr"
harness = false

[[bench]]
name = "snapshot"
harness = false

[lints]
workspace = true
