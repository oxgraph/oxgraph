[package]
name = "oxgraph-snapshot"
version = "0.0.0"
description = "Validated byte-level graph snapshot containers."
publish = false

authors.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
zerocopy = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
oxgraph-algo = { version = "0.0.0", path = "../oxgraph-algo", features = ["alloc"] }
oxgraph-csr = { version = "0.0.0", path = "../oxgraph-csr" }
oxgraph-graph = { version = "0.0.0", path = "../oxgraph-graph" }

[[bench]]
name = "snapshot"
harness = false

[lints]
workspace = true
