id: 12
name: no unwrap or expect in library code
description: |
  No `.unwrap()` or `.expect()` in any oxgraph crate's library code. Errors are
  handled by returning typed `Result` (constraint 14) or by proving the impossible
  case unreachable through type-system invariants (e.g., the `unreachable!()` in
  `u64_to_usize_validated` after validation has already enforced the bound).
kind: invariant
rule: |
  `expect_used = "deny"` and `unwrap_used = "deny"` stay set at the workspace
  `[lints.clippy]` level. Test code may use `.unwrap()` / `.expect()` when the
  failure unambiguously indicates a test fixture bug (not a contract violation
  under test), but library code never does.
enforcement: machine
profile: 1
status: canonical
intent:
  kind: invariant
  summary: No unwrap or expect in library code — errors return as typed Result, impossible cases are proven unreachable
  source: human
  impact_if_violated: |
    Consumers of the substrate inherit unhandled panics that surface unpredictably
    in production. The "safe to depend on" promise of a substrate weakens.
  rationale: |
    CLAUDE.md "Library discipline" states this explicitly. A panic from a substrate
    crate poisons every consumer that depends on it; typed errors let consumers
    decide how to respond. The lints make accidental introduction a build failure.
  verification_method: |
    Workspace-level clippy lints (expect_used / unwrap_used = deny) enforced by
    `just lint` and prek pre-commit.
realization:
- bindings:
  - scheme: path
    value: Cargo.toml
    metadata:
      summary: '[workspace.lints.clippy] sets expect_used = deny and unwrap_used = deny.'
  - scheme: path
    value: crates/oxgraph-snapshot/src/container/mod.rs
    metadata:
      summary: u64_to_usize_validated uses unreachable!() instead of expect/unwrap to prove the impossible case.
  role: primary
