id: 8
name: every measurable public input has criterion bench
description: |
  Third row of the verification matrix. Every public API that takes a measurable
  input (a size, a count, a payload length) and has a stated perf contract is
  defended by a criterion benchmark. Benchmarks for things WITHOUT a stated perf
  contract are noise — see constraint 10 (matrix is also the ceiling).
kind: requirement
rule: |
  For each public API with a stated perf contract (e.g., "O(n) for n ≤ 10k",
  "≤ 1ms for 100k offsets"), there is a criterion bench in the same crate's
  `benches/` that varies the measurable input across the contract's range and
  asserts the contract holds. Adding a bench for an API without a stated perf
  contract is forbidden — first state the contract in the doc, then bench it.
enforcement: manual
profile: 1
status: canonical
intent:
  kind: requirement
  summary: 'Row 3 of the verification matrix: measurable public input with a stated perf contract gets a criterion bench'
  source: human
  impact_if_violated: |
    Either perf contracts go undefended (regressions ship silently) or criterion
    sprawl drowns CI in noise that nobody reads.
  rationale: |
    CLAUDE.md verification-defaults table. Benchmarks defending no contract are
    explicitly listed as anti-patterns. The matrix is intentionally floor + ceiling:
    benches without contracts produce noise that looks like progress but isn't.
  verification_method: |
    `cargo bench --workspace` reviewed against documented perf contracts.
parents:
- id: 10
  role: component
realization:
