id: 27
name: topology weights are semantic free
description: |
  Optional topology weight capabilities attach total Copy values to visible elements,
  relations, or incidences without interpreting those values. They are shared topology
  primitives, not named properties or stochastic probabilities.
kind: invariant
rule: |
  ElementWeight, RelationWeight, and IncidenceWeight are optional topology
  capabilities that return Copy values for every visible ID in their family; the
  traits do not imply probability, distance, cost, capacity, count, or any other
  domain meaning.
enforcement: manual
profile: 1
status: proposed
intent:
  kind: invariant
  summary: Topology weight traits expose total Copy values without domain semantics
  source: ai
  rationale: |
    Many graph-like topology families need a lightweight value on elements, relations,
    or incidences, and algorithms should be able to bind on that capability without
    depending on storage or property crates. The value must stay semantic-free so the
    topology substrate does not absorb probability, metric, property-graph, or domain
    vocabulary.
  impact_if_violated: |
    Algorithms and users would infer semantics from the foundation trait itself,
    pushing meaning into the no_std substrate and making unrelated backends pay for a
    domain interpretation.
  verification_method: |
    Manual review of topology trait docs and algorithm docs. Algorithm modules must
    state their numeric contracts separately from the weight capability traits.
children:
- constraint: 29
  role: component
realization:
- bindings:
  - scheme: path
    value: crates/oxgraph-topology/src/lib.rs
    metadata:
      summary: ElementWeight, RelationWeight, and IncidenceWeight optional capability traits with Copy return values.
  role: primary
