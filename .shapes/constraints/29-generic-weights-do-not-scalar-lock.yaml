id: 29
name: generic weights do not scalar lock
description: |
  OxGraph's Rust substrate must not collapse generic topology weight, property,
  builder, or algorithm surfaces into a single scalar such as f64. Concrete scalar
  adapters are allowed only when they are explicitly named specializations at a
  boundary such as Python floats, tests, benches, or built-in PageRank scalar impls.
kind: invariant
rule: |
  Public Rust APIs above topology that expose topology weights, property layers,
  builder weights, or weighted algorithms must remain generic over the relevant
  scalar/value type. `f64` may appear only in explicitly named concrete
  specializations such as Python float adapters, tests/benches, or PageRank
  rank-scalar impls, never as the only Rust model.
enforcement: manual
profile: 1
status: proposed
intent:
  kind: invariant
  summary: Generic Rust layers must not force f64 or any other single scalar as the only weight/property/rank model
  source: human
  impact_if_violated: |
    Downstream users that need integer, fixed-point, f32, decimal, Arrow-native, or
    domain-specific scalar values would have to convert into f64 prematurely or fork
    the substrate. The generic topology weight architecture would be cosmetic rather
    than foundational.
  rationale: |
    The project intentionally made topology weights associated types so the engine can
    serve as a reusable graph substrate. The Python-enabling branch regressed by making
    property layers, builders, snapshots, and PageRank f64-only. This constraint makes
    the intended generic design falsifiable for review.
  verification_method: |
    Manual review of public Rust APIs and manifests. `rg` checks for f64-specialized
    public symbols are useful triage, but context decides whether each occurrence is an
    explicitly named specialization or an architectural scalar lock.
parents:
- id: 27
  role: component
realization:
- bindings:
  - scheme: path
    value: crates/oxgraph-topology/src/lib.rs
    metadata:
      summary: Weight capability traits use associated Weight types rather than f64.
  - scheme: path
    value: crates/oxgraph-property/src/lib.rs
    metadata:
      summary: Generic Arrow-backed property layers and selected weight adapters must realize this constraint.
  - scheme: path
    value: crates/oxgraph-algo/src/pagerank.rs
    metadata:
      summary: PageRank rank-scalar and input-weight conversion traits must realize this constraint.
  role: primary
