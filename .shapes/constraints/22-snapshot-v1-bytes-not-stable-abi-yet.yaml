id: 22
name: snapshot v1 bytes not stable abi yet
description: |
  Snapshot v1.0 is an "ABI candidate", not a stable ABI. Producers may write v1
  snapshots and readers may consume them, but the bytes are not yet promised to
  survive into v2 unchanged. Promotion to "stable ABI" is deferred — not a v1
  question. When promotion does happen, it will be a deliberate, separately
  justified decision.
kind: boundary
rule: |
  The crate-root doc, README, and any external announcement of snapshot v1.0
  must label the bytes as "ABI candidate" (or equivalent), not "stable ABI".
  No external system should be told to depend on the byte-exact format being
  stable until promotion happens. Stability promises live in code via the
  container's internal versioning (`format_major`, `format_minor`,
  `MAX_SUPPORTED_MINOR`) which v1 deliberately keeps strict.
enforcement: manual
profile: 1
status: canonical
intent:
  kind: boundary
  summary: Snapshot v1.0 bytes are ABI candidate, not stable ABI; promotion is deferred and is itself a deliberate later decision
  source: human
  impact_if_violated: |
    External consumers depend on byte-exact format prematurely; the project loses
    the design freedom it deliberately reserved; future minor bumps become
    breaking releases instead of additive ones.
  rationale: |
    Confirmed in interview. The format is the most strategically important asset
    of the project (vision §20-§21), and promoting too early would lock in
    mistakes the substrate cannot yet see. Strict v1 (MAX_SUPPORTED_MINOR=0,
    reserved fields must be zero) plus the explicit "candidate, not stable"
    framing buys design freedom for future minors without surprising consumers.
  verification_method: |
    Manual review on any external-facing snapshot documentation, README claims,
    or version bumps that would imply ABI stability.
realization:
- bindings:
  - scheme: path
    value: crates/oxgraph-snapshot/src/lib.rs
    metadata:
      summary: 'Crate doc: "v1.0 is the first topology-agnostic format major; the bytes are intentionally not yet promised as a stable ABI."'
  - scheme: path
    value: crates/oxgraph-snapshot/src/container/mod.rs
    metadata:
      summary: FORMAT_MAJOR=1, FORMAT_MINOR=0, MAX_SUPPORTED_MINOR=0 — strict on purpose.
  - scheme: path
    value: foundation-progress.md
    metadata:
      summary: Topology-Agnostic Snapshot v1 (ABI candidate) — explicitly framed as candidate, not stable ABI.
  role: primary
