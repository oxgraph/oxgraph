id: 22
name: Hypergraph PageRank distribution traits and entry-point collapse
description: Hypergraph PageRank distribution traits and entry-point collapse
targets:
  shape_ids:
  - 22
  - 9
status: proposed
version_impact: major
intent:
  kind: amendment
  summary: Introduce HypergraphOutgoingDistribution trait with built-in Uniform and HyperWeighted impls. Replace 2 hypergraph-side iterate kernels with one generic kernel parameterized by the trait. Collapse 6 hypergraph entry points (hypergraph_pagerank, hypergraph_pagerank_with_scratch, hypergraph_pagerank_with_workspace, hypergraph_pagerank_weighted, hypergraph_pagerank_weighted_with_scratch, hypergraph_pagerank_weighted_with_workspace) into 3 generic ones (pagerank_hypergraph, pagerank_hypergraph_with_scratch, pagerank_hypergraph_with_workspace). Mirrors amendment 20 on the hypergraph side. Closes the pre-existing verification-matrix gap for hyper PageRank with a generated BCSR proptest and three Criterion benches.
  source: human
  goals: |
    - Add `pub trait HypergraphOutgoingDistribution<H, S>` with bipartite methods
      `distribute_from_element` and `distribute_from_relation` capturing the
      per-state rank-distribution rules. Built-in `Uniform` (second impl on the
      existing struct, distinct trait) and `HyperWeighted<'rw, 'iw, RW, IW>`
      built-in match today's unweighted and weighted semantics.
    - Replace `iterate_hyper_unweighted` and `iterate_hyper_weighted` and their
      `push_hyper_*` helpers with a single `iterate_hypergraph<H, D>` that
      delegates per-state distribution to the trait.
    - Replace 6 hypergraph entry points with 3 generic entry points:
      `pagerank_hypergraph`, `pagerank_hypergraph_with_scratch`,
      `pagerank_hypergraph_with_workspace`. Each takes
      `&D: HypergraphOutgoingDistribution<H, S>` so callers pass `&Uniform` for
      the unweighted path or `&HyperWeighted::new(&relation_weights, &incidence_weights)`
      for the weighted path.
    - Open the trait so users can plug in custom bipartite rank-distribution
      rules without forking the kernel — the user-extensibility surface that
      was missing on the hypergraph side.
    - Update callers in `oxgraph` umbrella re-exports, the Python facade, and
      the algo tests/benches/transition fixture to use the new entry points.
      Python method names (`pagerank`, `weighted_pagerank`) are unchanged.
    - Add `generated_hypergraph_pagerank_preserves_mass_visibility_and_tier_equivalence`
      proptest mirroring the graph proptest. Generates small BCSR fixtures
      directly from binary participation pairs and asserts mass conservation,
      finiteness, non-negativity, invisible-state zeros, and allocating ≡
      scratch ≡ workspace equivalence.
    - Add three hyper criterion benches (`pagerank_hyper_bcsr_10k`,
      `pagerank_workspace_hyper_bcsr_10k`,
      `weighted_pagerank_workspace_visible_half_hyper_bcsr_10k`) over a
      deterministic 10k-vertex synthetic BCSR fixture with one ring and one
      skip hyperedge per vertex.
  non_goals: |
    No changes to `PageRankConfig`, `PageRankReport`, `PageRankError`,
    `HypergraphPageRankScratch`, or `HypergraphPageRankWorkspace` shapes. No
    new kani harness (the module-level `// kani-skip:` for unbounded power
    iteration remains).
  rationale: |
    The two hypergraph-side iteration kernels differ only in the per-state
    rank distribution rule (uniform vs. weighted), exactly the structural
    duplication that amendment 20 shed on the graph side. Collapsing them into
    a generic bipartite kernel parameterized by
    `HypergraphOutgoingDistribution` removes the kernel duplication while
    opening a user-extensibility surface. LLVM monomorphizes the generic
    kernel per built-in impl, so per-iteration cost matches today's
    specialized kernels (perf contract preserved). The single-trait /
    two-methods shape mirrors how the weighted variant already pairs
    `RelationWeight` and `IncidenceWeight` as one weighted policy. Renaming
    `hypergraph_pagerank*` → `pagerank_hypergraph*` mirrors amendment 20's
    `pagerank*` → `pagerank_graph*` rename, producing a consistent
    `pagerank_{topology}_*` family.
realization:
- bindings:
  - scheme: path
    value: crates/oxgraph-algo/src/pagerank.rs
    metadata:
      summary: Adds HypergraphOutgoingDistribution trait, second Uniform impl, HyperWeighted built-in, generic iterate_hypergraph kernel, and 3 entry points (pagerank_hypergraph, pagerank_hypergraph_with_scratch, pagerank_hypergraph_with_workspace). Removes iterate_hyper_unweighted, iterate_hyper_weighted, push_hyper_unweighted, push_hyper_weighted, and the 6 prior hypergraph entry points.
  - scheme: path
    value: crates/oxgraph-algo/src/lib.rs
    metadata:
      summary: Re-exports HypergraphOutgoingDistribution, HyperWeighted, and the 3 new hypergraph entry points; removes the 6 retired hypergraph entries.
  - scheme: path
    value: crates/oxgraph-algo/tests/pagerank.rs
    metadata:
      summary: All hypergraph PageRank call sites use the new entry points with &Uniform or &HyperWeighted::new(&rw, &iw). Adds generated_hypergraph_pagerank_preserves_mass_visibility_and_tier_equivalence proptest plus a generated_bcsr_sections helper that builds BCSR fixtures from binary participation pairs.
  - scheme: path
    value: crates/oxgraph-algo/tests/transition_fixture.rs
    metadata:
      summary: Updated to call pagerank_hypergraph with &HyperWeighted::new(&graph, &graph).
  - scheme: path
    value: crates/oxgraph-algo/benches/pagerank.rs
    metadata:
      summary: Adds pagerank_hyper_bcsr_10k, pagerank_workspace_hyper_bcsr_10k, and weighted_pagerank_workspace_visible_half_hyper_bcsr_10k benches plus a build_hypergraph fixture helper and BenchHyperRelationWeights / BenchHyperIncidenceWeights weight adapters.
  - scheme: path
    value: crates/oxgraph/src/lib.rs
    metadata:
      summary: Umbrella re-exports updated.
  - scheme: path
    value: bindings/python/src/lib.rs
    metadata:
      summary: Python facade pagerank methods call the new entry points. Python method names unchanged.
  role: primary
initiated_by:
  type: human
