id: 37
name: OxQL typed property predicates
description: OxQL typed property predicates
targets:
  shape_ids:
  - 34
  - 35
  - 37
status: proposed
version_impact: minor
intent:
  kind: amendment
  summary: Validate OxQL element property predicates against catalog family and literal type before planning
  source: human
  rationale: |
    Native OxQL property predicates are part of the same database contract as
    direct lookup APIs. A predicate over `MATCH ELEMENTS` must therefore reject
    relation or incidence property keys and reject literals whose parsed
    `PropertyType` does not match the catalog schema before the plan can
    silently execute as an empty raw scan.
initiated_by:
  type: human
realization:
- bindings:
  - scheme: path
    value: crates/oxgraph-db/src/query.rs
    metadata:
      summary: OxQL element property preparation validates key family and literal type, and execution uses the typed element property lookup path.
  - scheme: path
    value: crates/oxgraph-db/src/state.rs
    metadata:
      summary: Crate-private catalog validation helpers enforce property key family and typed lookup values for query predicates.
  - scheme: path
    value: crates/oxgraph-db/tests/e2e.rs
    metadata:
      summary: End-to-end OxQL tests cover valid element property predicates plus type mismatch and relation/incidence key family errors.
  role: primary
