id: 32
name: Database canonical identity
description: |
  Stable database identity model for canonical element, relation, incidence, and
  role IDs. Durable logs and catalog records use canonical IDs; compact snapshots
  may use local IDs only when identity maps preserve the canonical mapping.
profile: 1
status: proposed
intent:
  kind: interface
  summary: Stable canonical IDs for elements, relations, incidences, roles, snapshots, deltas, and compaction
  source: human
  goals: |
    - Provide explicit newtypes for canonical topology IDs and snapshot/commit
      generation identifiers.
    - Define allocation, tombstone, stale-handle, and no-reuse rules for durable
      database identity.
    - Require compaction to emit identity maps and rekey property layers whenever
      snapshot-local layout IDs differ from canonical IDs.
  non_goals: |
    No default ID newtypes leak into foundation topology crates.
  rationale: |
    Existing CSR/BCSR IDs are layout-local. A database needs durable identity
    that survives restart, WAL replay, checkpoint rebuilds, and local-ID
    compaction.
constraints:
