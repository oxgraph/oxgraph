  role: component
realization:
- bindings:
  - scheme: path
    value: crates/oxgraph-db/src/id.rs
    metadata:
      summary: Canonical ElementId, RelationId, IncidenceId, RoleId, LabelId, RelationTypeId, PropertyKeyId, ProjectionId, IndexId, CommitSeq, TransactionId, and CheckpointGeneration newtypes.
  - scheme: path
    value: crates/oxgraph-db/src/state.rs
    metadata:
      summary: Canonical record value types (ElementRecord/RelationRecord/IncidenceRecord/PropertySubject) and the nine-allocator NextIds watermark; recovery folds the elementwise maximum of the base header and every replayed delta-log frame so canonical ids are never reused. The live state is the merged overlay-over-base view in overlay.rs.
  - scheme: path
    value: crates/oxgraph-db/src/projection.rs
    metadata:
      summary: Projection-local element/relation/incidence ID newtypes with canonical identity mapping for graph and hypergraph materialized views.
  - scheme: path
    value: crates/oxgraph-db/src/proofs.rs
    metadata:
      summary: Macro-backed Kani proofs for checked_next monotonicity where applicable plus Eq/Ord and Hash/Eq consistency across canonical and projection-local database ID newtypes.
  role: primary
