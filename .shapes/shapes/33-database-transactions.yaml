id: 33
name: Database transactions
description: |
  Database transaction boundary for many concurrent readers and one writer. It
  defines reader pins, visible commit sequences, write-batch lifecycle, commit
  visibility, and atomicity across topology and property operations.
profile: 1
status: proposed
intent:
  kind: interface
  summary: Many-reader single-writer transaction model with reader pins and atomic write batches
  source: human
  goals: |
    - Expose read transactions pinned to a visible commit sequence and writer
      transaction high-water mark.
    - Expose one write transaction at a time with monotonic commit sequences.
    - Ensure topology creates/deletes, incidence roles, catalog updates, and
      property writes commit atomically or disappear together.
  non_goals: |
    No concurrent-writer conflict scheduler, distributed transactions, or SQL
    transaction compatibility in the first database engine slice.
  rationale: |
    Snapshot isolation is only meaningful when the visible generation and commit
    sequence are explicit. The engine shares an immutable base+overlay Snapshot
    behind an Arc (begin_read is an O(1) Arc clone), stages writes in an owned
    delta overlay, and commits by appending one fsync'd delta-log frame and
    publishing a fresh Snapshot (O(change), not a whole-store rewrite); recovery
    replays the valid log prefix over the base.
