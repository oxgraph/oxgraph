id: 16
name: mutation capabilities
description: |
  The deliberately-pending design slot for mutable topology — opt-in capability traits
  for owned mutable graphs, owned mutable hypergraphs, mutable builders, append-only
  topologies, base+delta layers, overlay views, copy-on-write topology, and freeze-to-
  snapshot workflows. Modeled early as a placeholder because mutation changes ID
  stability, deletion semantics, tombstones, compaction, freezing, and stale-handle
  behavior — those decisions cannot be retrofitted onto read views without breaking
  them. The first concrete child is a construction-time builder layer; general mutation
  remains deferred.
profile: 1
status: proposed
intent:
  kind: interface
  summary: Capability traits for mutable views — modeled early, implemented incrementally; specific layer shape decided when implementation pressure arrives
  source: human
  goals: |
    - Reserve the design space — make it explicit that mutation is opt-in and capability-
      typed, not retrofitted onto read traits later.
    - Distinguish concept tiers up-front: immutable view, mutable view, append-only
      mutable view, removable mutable view, overlay view, freezable builder, validated
      snapshot.
    - Commit the first concrete child as append/update-only builders that freeze to
      immutable views, while leaving overlays and removable mutation for later shapes.
  non_goals: |
    No deletion, tombstones, ID reuse, compaction policies, overlay views, or mutation
    methods on existing read traits. The builder child is construction-time only, not a
    general mutable graph API.
  rationale: |
    Mutation cannot be deferred entirely — it is one of the next things to implement.
    The Python-enabling slice picked the producer-side first move: builder + freeze →
    immutable view/snapshot. Modeling the broader shape as proposed keeps overlay and
    full mutation semantics out of scope until they have their own pressure and rules.
