    metadata:
      summary: Public property descriptors, layer validation errors, generic Arrow-backed dense/sparse layers, and selected weight adapters. Weight adapters are unified into DenseWeights / SparseWeights parameterized by a PropertyAxis marker (ElementAxis / RelationAxis / IncidenceAxis); call sites spell out the axis explicitly (no compat aliases).
  role: primary
