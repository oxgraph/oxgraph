  - scheme: path
    value: justfile
    metadata:
      summary: '`just ci` (fast gate — fmt/taplo/clippy/deny/test) and `just verify` (heavy gate — miri/kani).'
  - scheme: path
    value: crates/oxgraph-snapshot/src/proofs.rs
    metadata:
      summary: Kani harnesses for the snapshot container — header parsing totality, malformed-bytes never panic, plan/open roundtrip.
  - scheme: path
    value: crates/oxgraph-hyper-bcsr/src/proofs.rs
