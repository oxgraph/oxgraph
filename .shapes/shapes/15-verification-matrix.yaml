  - scheme: path
    value: crates/oxgraph-csr/benches/csr.rs
    metadata:
      summary: Criterion bench for CSR validation and outgoing traversal over deterministic regular graphs.
  - scheme: path
    value: crates/oxgraph-algo/benches/bfs.rs
    metadata:
      summary: Criterion bench for BFS storage tiers over CSR-backed graph shapes.
  role: primary
