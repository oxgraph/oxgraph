id: 17
name: CSC reverse traversal
description: |
  Incoming traversal for binary graphs via `oxgraph-csc`: borrowed CSC views over
  Postgres-owned OXGTOPO inbound sections (`0x0201` / `0x0202`). Separate from
  forward-only `oxgraph-csr` so callers cannot mix adjacency directions at the type level.
profile: 1
status: canonical
intent:
  kind: feature
  summary: Incoming traversal layout for binary graphs as oxgraph-csc snapshot views
  source: human
  goals: |
    - Ship `oxgraph-csc` as the inbound adjacency crate for Postgres snapshots.
    - Open inbound sections from validated OXGTOPO bytes with explicit section kinds.
    - Validate with roundtrip integration tests and bounded kani open totality.
  non_goals: |
    - No COO, edge-table, or unified layout abstraction in this shape.
    - No forward CSR changes in oxgraph-csr.
  rationale: |
    CSR is the smallest useful forward layout; inbound CSC is required for bidirectional
    Postgres graph queries and is modeled as a sibling crate rather than bolting reverse
    traversal onto oxgraph-csr.
parents:
- id: 1
  role: component
realization:
- bindings:
  - scheme: path
    value: crates/oxgraph-csc
    metadata:
      summary: Borrowed inbound CSC views from Postgres-owned snapshot sections.
  role: primary
