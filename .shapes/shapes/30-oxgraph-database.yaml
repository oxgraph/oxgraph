id: 30
name: OxGraph Database
description: |
  Standalone OxGraph-native database product built above the topology substrate.
  It provides durable storage, transactions, cataloged properties/indexes, query
  execution, and user-facing server/CLI surfaces without moving labels, query
  semantics, or storage policy into foundation crates.
profile: 1
status: proposed
intent:
  kind: service
  summary: Standalone OxGraph-native database product above the topology substrate
  source: human
  goals: |
    - Ship an embedded database engine crate with create/open, durable recovery,
      many-reader single-writer transactions, canonical IDs, and compaction.
    - Expose an incidence-first logical model where property-graph behavior is a
      projection and hypergraphs remain one relation with many incidences.
    - Add query core, OxQL, Cypher compatibility planning, HTTP/CLI surfaces, and
      cataloged index metadata as product-layer concerns.
    - Reuse existing substrate, snapshot, property, CSR/CSC, and BCSR crates
      without contaminating their domain-neutral contracts.
  non_goals: |
    No labels, relationship types, property schemas, query language semantics,
    WAL records, server policy, or database transaction semantics enter
    oxgraph-topology, oxgraph-graph, oxgraph-hyper, or layout crates.
    Backward compatibility with experimental Postgres surfaces is not a goal.
  rationale: |
    OxGraph's durable advantage is validated zero-copy topology snapshots and
    storage-agnostic traversal. A database should productize that advantage in a
    higher layer rather than copying Neo4j's storage engine or turning the
    substrate into a domain system.
