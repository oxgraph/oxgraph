id: 31
name: OXGDB storage and recovery
description: |
  Durable database storage layer: an immutable per-generation base snapshot plus
  an append-only delta-log (WAL) and a superblock linearization point; CRC32C
  content integrity, create/open, valid-prefix crash recovery, and checkpoint
  folding the log into a fresh base.
profile: 1
status: proposed
intent:
  kind: module
  summary: Durable OXGDB store format, recovery validation, and compaction rewrite
  source: human
  goals: |
    - Define the on-disk OXGDB contract: an immutable base snapshot, an
      append-only CRC-framed delta-log (WAL), and a superblock floor.
    - Commit by appending one fsync'd delta frame (O(change)); publish via the
      atomic superblock rename as the single linearization point.
    - Recover deterministically by replaying the valid log prefix over the base
      (torn tail truncates; interior corruption or a CRC mismatch is rejected).
    - Checkpoint by folding base+overlay into a fresh base generation, rotating
      the log, and preserving canonical ids.
  non_goals: |
    No distributed replication, in-place page-store mutation engine, external
    WAL-format compatibility, or a stable public ABI promise for OXGDB bytes yet.
  rationale: |
    OXGDB needs a real crash model and an O(change) commit, not a whole-store
    reprint. An immutable base + append-only delta-log + superblock gives
    O(change) durable commits, valid-prefix recovery, and canonical-ID-preserving
    checkpoints, which the earlier reprint design (amendment 40) could not.
