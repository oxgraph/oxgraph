id: 31
name: OXGDB storage and recovery
description: |
  Durable database storage layer: greenfield OXGDB store publication with a
  fixed zerocopy header, exact-size payload validation, checksums, create/open,
  corrupt-store detection, and compaction rewrite.
profile: 1
status: proposed
intent:
  kind: module
  summary: Durable OXGDB store format, recovery validation, and compaction rewrite
  source: human
  goals: |
    - Define the on-disk OXGDB store contract using a fixed zerocopy header and
      a validated product payload.
    - Store IO-boundary headers with zerocopy-compatible layouts and explicit
      payload checksums.
    - Recover deterministically by rejecting malformed, trailing, or
      checksum-mismatched store bytes.
    - Publish compaction by validating state and atomically replacing the store.
  non_goals: |
    No distributed replication, page-store mutation engine, WAL compatibility,
    manifest compatibility, or stable public ABI promise for OXGDB bytes.
  rationale: |
    The Postgres overlay model is not a standalone storage engine. OXGDB needs
    a crash model, reader-generation protocol, and canonical-ID-preserving
    compaction before it can be trusted as a database.
