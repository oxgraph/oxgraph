id: 23
name: Python facade
description: |
  Python package/import surface for OxGraph. The native module wraps Rust builders,
  frozen views, identity lookup, property/weight layers, BFS, PageRank, and snapshot
  helpers while keeping Python labels in facade-owned maps. It exposes OxGraph concepts
  rather than third-party graph-library exporters.
profile: 1
status: proposed
intent:
  kind: interface
  summary: Python package exposing OxGraph builders, views, properties, BFS, PageRank, and identity
  source: ai
  goals: |
    - Add oxgraph-python inside the workspace with a PyO3 native module importable as
      oxgraph.
    - Expose graph and hypergraph builders, frozen owned views, BFS, PageRank, relation
      weights, named property layers, labels, and local/canonical lookup.
    - Keep Python float APIs as explicit boundary specializations over generic Rust property, builder, and PageRank scalar APIs.
    - Translate typed Rust errors into Python exceptions without panicking across FFI.
    - Keep Python labels facade-owned and never interpreted by Rust algorithms.
    - Document ownership/lifetime, stale view, GIL, panic, and unsafe boundary behavior.
  non_goals: |
    No NetworkX/igraph/PyTorch/DGL exporters, no downstream birdsong changes, no Python
    domain semantics in topology, and no borrowed frozen view lifetime footguns in the
    first surface.
  rationale: |
    Downstream Python users need OxGraph construction and algorithms, but the binding
    should expose the same substrate concepts Rust uses. Owned frozen views avoid Python
    lifetime hazards while preserving the builder/freeze separation.
