    metadata:
      summary: Crate metadata — license, keywords, categories, version 0.0.0; no dependencies yet.
  - scheme: path
    value: crates/oxgraph/src/lib.rs
    metadata:
      summary: Crate root — currently just `#![no_std]` and the crate-level doc string.
  role: primary
parents:
