id: 11
name: umbrella crate
description: |
  The single ergonomic dependency point that re-exports the curated workspace surface
  behind feature flags so most users never type the sub-crate names directly. It is a 0.1.0
  feature-gated re-export crate: consumers can pick topology/graph/csr/snapshot/algo,
  property, builder, database, and hyper layers without paying for unrelated
  crates. Exists because oxgraph is a monorepo: the
  umbrella keeps the published surface tidy while letting downstream consumers depend
  on individual crates when they want minimal compile times.
profile: 1
status: canonical
intent:
  kind: module
  summary: Curated re-exports across the workspace, gated by feature sets
  source: human
  goals: |
    - Curated re-exports of the substrate crates (topology + graph + csr + snapshot + algo)
      plus property, builder, and database layers under one import path, gated by features.
    - Tidy publish surface so the world depends on `oxgraph` by default and reaches for
      individual crates only when they need minimal compile time or no_std isolation.
    - Publish 0.1.x as the pre-1.0 crates.io surface for the DB-inclusive umbrella;
      do not invent helpers in the umbrella that the kernel crates lack.
  non_goals: |
    No helpers that don't exist in the re-exported crates. No "happy-path" wrappers that
    hide capability requirements. No stable promises until v1 actually freezes the
    re-export shape.
  rationale: |
    Without an umbrella, every consumer has to remember which kernel crate exports
    which trait. The umbrella concentrates discovery in one place. Feature gates keep
    the umbrella honest about what the consumer is actually pulling in (no hidden hyper
    cost in a graph-only build).
realization:
- bindings:
  - scheme: path
    value: crates/oxgraph
    metadata:
