id: 26
name: shared CSR validation utilities
description: |
  Tiny no_std utility crate that owns the offset-integrity predicates shared
  by oxgraph-csr (binary CSR) and oxgraph-hyper-bcsr (bipartite CSR) layouts.
  Hosts a sealed ZerocopyWord trait (opted into by CsrWord and BcsrWord) and
  small pure functions for length / first-zero / monotonicity / final-offset /
  value-range checks. Returns OffsetIntegrityIssue; each layout maps the
  issue to its typed error at the boundary, stamping any section discriminator
  the layout needs.
profile: 1
status: proposed
intent:
  kind: module
  summary: Shared offset-integrity primitives consumed by CSR and BCSR layouts
  source: human
  goals: |
    - Own the sealed ZerocopyWord trait that both CsrWord and BcsrWord use
      via supertrait, so the layout-validation predicates can be generic in
      one trait without widening the public surface.
    - Expose check_offsets_monotonic, check_value_range, check_offset_section
      as ordinary pub fns returning OffsetIntegrityIssue.
    - Keep predicate-level kani proofs here; layout-level proofs in
      oxgraph-csr and oxgraph-hyper-bcsr stay end-to-end and are unchanged.
    - Stay no_std, dependency-light. Only depends on zerocopy for LE word
      sealing.
  non_goals: |
    No domain semantics, no public trait surface beyond ZerocopyWord, no
    layout-specific section enums, no error type embedding section
    discriminators (those are caller-mapped). Not a snapshot container.
  rationale: |
    The five offset-walk predicates were duplicated between oxgraph-csr's
    inline CsrGraph::validate and oxgraph-hyper-bcsr's
    internal/validation.rs::validate_one_offsets et al. Promoting them to a
    shared crate gives one canonical predicate path with one set of kani
    proofs, while letting each layout keep its typed error and
    section-discriminator vocabulary at the boundary. Per shape:2, topology
    explicitly excludes CSR/snapshot-format primitives, so the canonical
    home is a dedicated utility crate.
constraints:
- 4
realization:
- bindings:
  - scheme: path
    value: crates/oxgraph-csr-util
    metadata:
      summary: The crate root. Hosts ZerocopyWord, OffsetIntegrityIssue, and the three offset-integrity predicates.
  - scheme: path
    value: crates/oxgraph-csr-util/src/lib.rs
    metadata:
      summary: Sealed ZerocopyWord trait with native (u16/u32/u64/usize) and little-endian (U16<LE>/U32<LE>/U64<LE>) impls. Predicates check_offsets_monotonic, check_value_range, check_offset_section.
  - scheme: path
    value: crates/oxgraph-csr-util/src/proofs.rs
    metadata:
      summary: kani proofs for predicate totality and the algebraic contract of the three checks.
  role: primary
amendment_log:
