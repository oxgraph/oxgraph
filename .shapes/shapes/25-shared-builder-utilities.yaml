id: 25
name: shared builder utilities
description: |
  Originally a tiny no_std + alloc utility crate (oxgraph-build-util) that was
  to own the canonical BuildIndex trait shared by oxgraph-graph-build and
  oxgraph-hyper-build, plus pure-function primitives both builders need
  (id-to-slot validation, bucketed offset-index construction, typed data
  enums). The crate was created (amendment 18) and then immediately merged
  with oxgraph-csr-util (shape:26) into a single utility crate
  oxgraph-layout-util by commit af3289e (amendment 24). The unified crate is
  covered by shape:27 (layout utilities); this shape is retained as a
  historical record.
profile: 1
status: superseded
intent:
  kind: module
  summary: Superseded — folded together with shape:26 into shape:27 (layout utilities); see oxgraph-layout-util
  source: human
  goals: |
    - Own the canonical BuildIndex sealed-trait definition (currently duplicated in
      oxgraph-graph-build and oxgraph-hyper-build).
    - Provide id_to_slot, slot_or_max, index_from_usize, and build_offset_index as
      ordinary pub fns over BuildIndex — no traits or trait indirection beyond
      BuildIndex itself.
    - Return small data enums (IdOutOfBounds, OffsetOverflow) so each calling
      builder maps the issue to its typed error variant. No Box<dyn Error>.
    - Stay no_std + alloc, dependency-light, and free of any oxgraph-graph,
      oxgraph-hyper, oxgraph-csr, oxgraph-snapshot, or Arrow imports.
  non_goals: |
    No domain semantics, no public trait surface beyond BuildIndex, no snapshot
    or Arrow dependencies, no graph or hypergraph specific types. Not a place to
    park future builder utilities that need crate-specific knowledge.
  rationale: |
    BuildIndex and the slot/bucketing primitives were duplicated byte-for-byte
    between oxgraph-graph-build and oxgraph-hyper-build before amendment 18.
    shape:2 (topology substrate) explicitly excludes builders, so the canonical
    home could not be oxgraph-topology. The dedicated utility crate kept the
    dedup honest without inflating either builder's responsibility surface.
    The post-consolidation home for these primitives is oxgraph-layout-util
    (shape:27), which also absorbs the read-time offset-integrity primitives
    that shape:26 owned.
realization:
- bindings:
  - scheme: path
    value: crates/oxgraph-layout-util/src/lib.rs
    metadata:
      summary: Successor location. Hosts BuildIndex, id_to_slot, slot_or_max, index_from_usize, build_offset_index, IdOutOfBounds, OffsetOverflow alongside the read-time offset-integrity primitives shape:26 used to own.
  - scheme: path
    value: crates/oxgraph-layout-util/src/proofs.rs
    metadata:
      summary: Successor location for the kani proofs of build_offset_index algebraic contracts and overflow totality.
  role: primary
amendment_log:
- 18
- 24
