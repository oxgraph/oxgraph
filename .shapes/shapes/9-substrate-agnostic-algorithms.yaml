id: 9
name: substrate agnostic algorithms
description: |
  Algorithms expressed over oxgraph-topology trait bounds, not over specific layouts.
  The same BFS implementation runs unchanged on oxgraph-csr::CsrGraph and on
  oxgraph-hyper-bcsr::BcsrHypergraph, and on any future view that exposes
  ElementSuccessors / ElementPredecessors. no_std with optional alloc and std tiers.
  Substrate-agnostic by design — does not pick a domain (graph vs. hypergraph) at the
  trait-bound level.
profile: 1
status: canonical
intent:
  kind: module
  summary: Algorithms over topology trait bounds — BFS today, more later
  source: human
  goals: |
    - Bind algorithms on oxgraph-topology capability traits, not on graph or hypergraph
      specializations, so the same code runs across substrates.
    - Provide a tiered storage model so strict no_std callers, alloc callers without
      dense indexes, and std callers all have a path that fits their environment.
    - Forward and reverse variants for every algorithm where direction matters; share
      the underlying scratch and workspace types across directions.
  non_goals: |
    No graph- or hypergraph-specific algorithms here. No mutation algorithms. No
    parallel/distributed traversal. No algorithms that require capability tiers the
    substrate has not added yet.
  rationale: |
    Algorithms targeting concrete graph types lock the substrate's value behind one
    layout. Targeting topology trait bounds is what lets the same BFS produce both
    CsrGraph traversal and BcsrHypergraph reachability — proving the trait surface is
    genuinely substrate-agnostic. Direction parameterization through a sealed
    ExpansionDirection policy gets monomorphized at zero runtime cost.
