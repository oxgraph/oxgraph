id: 35
name: OxQL frontend
description: |
  Native OxGraph query language that exposes topology-first concepts directly
  and lowers into the shared database query core.
profile: 1
status: proposed
intent:
  kind: interface
  summary: OxGraph-native query language lowering into the database query core
  source: human
  goals: |
    - Query elements, relations, incidences, roles, and properties without
      reducing hypergraphs to binary edges.
    - Provide a textual frontend for the same IR used by Rust query APIs.
    - Keep parsing errors and semantic errors typed and deterministic.
  non_goals: |
    OxQL is not a Cypher clone and does not define foundation-crate semantics.
  rationale: |
    OxGraph needs a native language that matches its incidence-first model.
    Property-graph compatibility can then be expressed as a projection, not as
    the database's core identity.
