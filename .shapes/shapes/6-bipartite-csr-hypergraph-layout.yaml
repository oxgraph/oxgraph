id: 6
name: bipartite CSR hypergraph layout
description: |
  The hypergraph counterpart to oxgraph-csr. A borrowed bipartite-CSR view that
  validates eight section payloads — head/tail offsets and participants per hyperedge,
  plus outgoing/incoming offsets and hyperedge IDs per vertex — and implements every
  read-view trait in oxgraph-hyper with O(degree) traversal in either direction.
  Validation is tiered through BcsrValidation (Layout for cheap structural invariants;
  Strict adds cross-direction multiset equality). v1.0 caps each of vertex_count,
  hyperedge_count, and per-direction participant totals at 2^32 - 1.
profile: 1
status: canonical
intent:
  kind: module
  summary: Borrowed bipartite-CSR hypergraph view with forward and reverse traversal
  source: human
  goals: |
    - Implement DirectedHyperedgeParticipants, DirectedHyperedgeIncidences,
      DirectedVertexHyperedges, DirectedVertexSuccessors, DirectedVertexPredecessors,
      and the Hypergraph capability bundle.
    - Provide tiered validation: Layout (cheap, structural) and Strict (cross-direction
      multiset equality between hyperedge-major and vertex-major indexes).
    - Open from snapshot sections via BcsrHypergraph::from_snapshot using the eight
      registered BCSR_* section kinds (0x0010..=0x0017).
    - Be the first concrete hypergraph layout that pressure-tests oxgraph-hyper.
  non_goals: |
    No general hyper-layout abstraction yet, no hypergraph algorithms (those belong in a
    future oxgraph-hyper-algo), no domain semantics, no mutation. Section kinds
    0x0018..=0x001F are reserved for u64-offset variants but not implemented in v1.
  rationale: |
    A bipartite CSR — one CSR per direction, hyperedge-major plus vertex-major — is the
    natural hypergraph counterpart to a graph CSR. Carrying both directions natively
    rather than only one is what lets DirectedVertexPredecessors exist at all, which
    matters for hypergraph reachability and propagation. The 2^32-1 cap keeps validation
    arithmetic provable under kani; future minors can introduce u64-offset variants in
    the reserved 0x0018..=0x001F section-kind range.
constraints:
- 5
realization:
