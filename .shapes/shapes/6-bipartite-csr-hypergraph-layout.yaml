  - scheme: path
    value: crates/oxgraph-hyper-bcsr
    metadata:
      summary: The crate root. Borrowed bipartite-CSR view + tiered validation + snapshot-open path.
  - scheme: path
    value: crates/oxgraph-hyper-bcsr/src/lib.rs
    metadata:
      summary: BcsrHypergraph, BcsrValidation, eight registered section kinds, error enums, and directed relation/incidence traversal trait implementations.
  - scheme: path
    value: crates/oxgraph-hyper-bcsr/src/word.rs
    metadata:
      summary: BcsrIndex, BcsrSnapshotIndex endian conversion, and little-endian snapshot word traits for BCSR payloads.
  - scheme: path
    value: crates/oxgraph-hyper-bcsr/src/internal/validation.rs
    metadata:
      summary: Layout and Strict validators — Strict adds cross-direction multiset equality.
  role: primary
