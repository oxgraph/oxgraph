id: 28
name: Postgres storage engine
description: |
  Reusable Rust library `oxgraph-postgres` for Postgres-backed OxGraph: catalog model,
  relational build into OXGTOPO snapshots, artifact I/O, active engine with overlays
  and sync replay, and query algorithms. No pgrx dependency; SPI stays in the extension crate.
profile: 1
status: canonical
intent:
  kind: feature
  summary: First-class Postgres graph engine as a workspace rlib without pgrx
  source: ai
  goals: |
    - Persist canonical OXGTOPO bytes (CSR topology + Postgres-owned sections in 0x0200+).
    - Keep CSR reads limited to topology sections; Postgres library reads its own sections.
    - Expose catalog, build, engine, overlay, sync, and query algorithms via Engine methods.
    - Remain `unsafe_code = forbid` with typed errors and documented perf contracts.
  non_goals: |
    - No SPI, triggers, GUC registration, or SQL facades in this crate.
    - No adoption of pgGraph `.pggraph` wire layout.
    - No foundation crate public API changes unless an approved follow-up shape lands.
  rationale: |
    Splitting the engine from pgrx keeps `just ci` fast, preserves workspace lint discipline,
    and lets integration tests and benches depend on algorithms without PostgreSQL installed.
constraints:
- 12
- 14
- 21
realization:
