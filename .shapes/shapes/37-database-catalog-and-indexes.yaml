realization:
- bindings:
  - scheme: path
    value: crates/oxgraph-db/src/catalog.rs
    metadata:
      summary: Catalog definitions and name maps for roles, labels, relation types, property keys, graph projections, hypergraph projections, label/type/property/composite/projection indexes, and schema validation.
  - scheme: path
    value: crates/oxgraph-db/src/state.rs
    metadata:
      summary: Catalog-backed label/type/property mutation, typed property enforcement, tombstone cleanup, schema-checked property equality/range scans, query predicate family/type validation, composite tuple scans, and index lookup support.
  - scheme: path
    value: crates/oxgraph-db/src/projection.rs
    metadata:
      summary: Cataloged CSR/CSC-style graph projections and BCSR-style directed hypergraph projections exposing oxgraph-graph and oxgraph-hyper trait surfaces plus deterministic projection-index subjects and graph traversal inputs.
  - scheme: path
    value: crates/oxgraph-db/benches/open_recovery.rs
    metadata:
      summary: Criterion coverage for graph projection trait traversal, public graph traversal API, hypergraph traversal, typed property equality lookup, typed index lookup, query planning, query execution, commit, begin_read, begin_write, and open recovery.
  role: primary
