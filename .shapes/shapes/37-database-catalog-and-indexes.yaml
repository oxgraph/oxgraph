id: 37
name: Database catalog and indexes
description: |
  Product-layer catalog and physical index system for labels, types, property
  schemas, index definitions, index manifests, projection indexes, and planner
  cost metadata.
profile: 1
status: proposed
intent:
  kind: module
  summary: Catalog dictionaries, property schemas, index definitions, projection indexes, and planner cost metadata
  source: human
  goals: |
    - Store label/type dictionaries and property schemas above topology.
    - Track topology, incidence-role, label/type membership, equality/range,
      composite, CSR/CSC projection, and BCSR/hypergraph projection indexes.
    - Maintain index definitions through WAL/recovery/compaction and expose
      planner cost metadata.
  non_goals: |
    No index semantics in topology crates and no assumption that one layout is
    the database's semantic model.
  rationale: |
    Layouts are cost models. A database planner needs cataloged physical indexes
    without confusing those indexes for the meaning of the graph.
