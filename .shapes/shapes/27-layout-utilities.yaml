    metadata:
      summary: Sealed BuildIndex trait (native u16/u32/u64/usize impls) and the build-time helpers id_to_slot / slot_or_max / index_from_usize / build_offset_index returning IdOutOfBounds / OffsetOverflow. Sealed ZerocopyWord trait (native + little-endian U16<LE>/U32<LE>/U64<LE> impls) and the read-time predicates check_offsets_monotonic / check_value_range / check_offset_section returning OffsetIntegrityIssue.
  - scheme: path
    value: crates/oxgraph-layout-util/src/proofs.rs
    metadata:
      summary: Kani proofs for build_offset_index algebraic contracts and overflow totality plus predicate totality and the algebraic contract of the three offset-integrity checks.
  role: primary
