id: 34
name: Database query core
description: |
  Internal query core for OxGraph Database: logical IR, semantic analysis,
  physical planning, execution operators, value/result model, and storage traits
  consumed by native OxQL and compatibility frontends.
profile: 1
status: proposed
intent:
  kind: module
  summary: Private query IR, semantic analysis, planning, execution, values, and storage traits
  source: human
  goals: |
    - Define a storage-neutral query core over topology, properties, indexes,
      and transactions.
    - Keep planner/executor internals private until contracts are proven by
      tests and benchmarks.
    - Support prepare, execute, explain, parameter binding, streaming result
      rows, pattern expansion, mutation operators, and path semantics.
  non_goals: |
    No query language semantics in foundation crates and no public compatibility
    claim before conformance suites exist.
  rationale: |
    Text syntaxes should lower into one semantic core. This prevents OxQL,
    Cypher, Rust APIs, and future adapters from becoming parallel query engines.
