realization:
- bindings:
  - scheme: path
    value: crates/oxgraph-db/src/query.rs
    metadata:
      summary: PreparedQuery, QueryLanguage, QueryResult, QueryRow, QueryValue, explain, OxQL/Cypher semantic preparation, typed element property predicate validation, scans, label/type/property lookup plans, graph projection WALK traversal, NEIGHBORS shorthand, and Cypher directed triple execution.
  - scheme: path
    value: crates/oxgraph-db/src/database.rs
    metadata:
      summary: Database::prepare and ReadTransaction execute/explain/traverse_graph entrypoints over pinned state snapshots, properties, indexes, and projection materialization.
  - scheme: path
    value: crates/oxgraph-db/tests/recovery_proptest.rs
    metadata:
      summary: Property tests for query preparation, indexed lookups, generated recovery, projection equivalence, graph traversal BFS equivalence, and executor agreement with generated reference counts.
  role: primary
