[workspace]
members = [
  "crates/oxgraph",
  "crates/oxgraph-algo",
  "crates/oxgraph-csr",
  "crates/oxgraph-csc",
  "crates/oxgraph-db",
  "crates/oxgraphd",
  "crates/oxgraph-graph",
  "crates/oxgraph-hyper",
  "crates/oxgraph-hyper-bcsr",
  "crates/oxgraph-layout-util",
  "crates/oxgraph-mmap",
  "crates/oxgraph-pgrx",
  "crates/oxgraph-postgres",
  "crates/oxgraph-property",
  "crates/oxgraph-snapshot",
  "crates/oxgraph-topology",
]
default-members = [
  "crates/oxgraph",
  "crates/oxgraph-algo",
  "crates/oxgraph-csr",
  "crates/oxgraph-csc",
  "crates/oxgraph-db",
  "crates/oxgraphd",
  "crates/oxgraph-graph",
  "crates/oxgraph-hyper",
  "crates/oxgraph-hyper-bcsr",
  "crates/oxgraph-layout-util",
  "crates/oxgraph-mmap",
  "crates/oxgraph-postgres",
  "crates/oxgraph-property",
  "crates/oxgraph-snapshot",
  "crates/oxgraph-topology",
]
resolver = "3"

[workspace.package]
authors = ["oxgraph contributors"]
categories = ["data-structures"]
edition = "2024"
keywords = ["graph", "topology", "zero-copy"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/oxgraph/oxgraph"
version = "0.4.2"
# rust-version intentionally omitted: rust-toolchain.toml pins the daily toolchain; kani ships
# its own nightly below latest stable, and we're not publishing an MSRV contract yet.

[workspace.dependencies]
arrow-array = "58.3.0"
arrow-ipc = "58.3.0"
arrow-schema = "58.2.0"
arrow-select = "58.2.0"
crc32c = "0.6.8"
memmap2 = "0.9.8"
yoke = { version = "0.8.3", features = ["derive"] }
zerocopy = { version = "0.8.50", default-features = false, features = ["derive"] }

# Dev / test
criterion = { version = "0.8.2", default-features = false, features = [
  "cargo_bench_support",
  "html_reports",
  "plotters",
] }
proptest = "1.11.0"
saphyr-parser = "0.0.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[workspace.lints.rust]
rust_2024_compatibility = { level = "deny", priority = -1 }
missing_docs = "deny"
unreachable_pub = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
# Lint groups — everything denied, negative priority so individual lints can override.
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Complexity lints — explicit denials (thresholds set in clippy.toml).
cognitive_complexity = "deny"
excessive_nesting = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
type_complexity = "deny"

# Docs — private items too.
missing_docs_in_private_items = "deny"

# Panic shortcuts — library and example code should return typed errors or prove invariants.
expect_used = "deny"
unwrap_used = "deny"

# Block silent suppression: force #[expect(..., reason = "...")] over #[allow(...)].
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Explicit allow list — the only way to silence a lint workspace-wide.
# Rationale stays in comments because the cargo manifest doesn't accept a `reason` key.
# Reason: transitive dep graph — we don't control upstream majors. Revisit per-crate when
# the conflict is ours.
multiple_crate_versions = { level = "allow", priority = 1 }
# Reason: scaffolding noise — remove once the crate surface stabilises.
module_name_repetitions = { level = "allow", priority = 1 }

[profile.release]
codegen-units = 1
lto = "thin"

[profile.bench]
inherits = "release"

[profile.dev]
debug = "line-tables-only"
